name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Trusted Publishing (OIDC) con PyPI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests antes de publicar
        run: |
          pip install -e ".[dev]"
          ruff check src tests
          pytest -q
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Publicar en PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
