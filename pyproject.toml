[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "derogada"
version = "0.1.0"
description = "Detecta normas derogadas o modificadas en documentos jurídicos contrastando cada cita con el BOE y EUR-Lex"
readme = "README.md"
requires-python = ">=3.10"
license = "CC-BY-NC-SA-4.0"
authors = [{ name = "686f6c61" }]
keywords = ["legaltech", "BOE", "EUR-Lex", "normativa", "derogación"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Legal Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
]
dependencies = [
    "litellm>=1.40",
    "pydantic>=2",
    "httpx>=0.27",
    "tenacity>=8.2",
    "typer>=0.12",
    "rich>=13",
    "python-docx>=1.1",
    "pymupdf>=1.24",
]

[project.urls]
Homepage = "https://derogada.686f6c61.dev"
Documentation = "https://derogada.686f6c61.dev/tecnica.html"
Repository = "https://github.com/686f6c61/derogada"
Issues = "https://github.com/686f6c61/derogada/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-recording>=0.13",
    "vcrpy>=6",
    "ruff>=0.5",
    "mypy>=1.10",
]
demo = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
derogada = "derogada.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/derogada"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
