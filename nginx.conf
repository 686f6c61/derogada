server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css text/html application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Hardening básico
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Imagen social y assets: cacheables una semana
    location ~* \.(png|jpg|jpeg|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Proxy same-origin a CELLAR (EUR-Lex): la demo del navegador verifica
    # normas UE sin CORS ni terceros. Solo viaja el CELEX (dato público).
    location = /cellar-proxy {
        resolver 127.0.0.11 1.1.1.1 valid=300s ipv6=off;
        proxy_pass https://publications.europa.eu/webapi/rdf/sparql$is_args$args;
        proxy_set_header Host publications.europa.eu;
        proxy_set_header Accept "application/sparql-results+json";
        proxy_ssl_server_name on;
        proxy_read_timeout 60s;
    }
}
